<svg xmlns="http://www.w3.org/2000/svg" width="680" height="450" viewBox="0 0 680 450" role="img">
<title>Registry, collections and datasets</title>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.th{font-size:14px;font-weight:600;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.c-teal rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal text{fill:#085041}
.c-purple rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple text{fill:#3C3489}
.c-gray rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray text{fill:#444441}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="450" fill="#FFFFFF"/>
<text class="ts" x="20" y="68" dominant-baseline="central">Registry</text>
<text class="ts" x="20" y="168" dominant-baseline="central">Collections</text>
<text class="ts" x="20" y="278" dominant-baseline="central">Datasets</text>
<text class="ts" x="20" y="398" dominant-baseline="central">Files</text>
<g class="c-teal"><rect x="254" y="40" width="220" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="364" y="59" text-anchor="middle" dominant-baseline="central">Registry</text>
<text class="ts" x="364" y="77" text-anchor="middle" dominant-baseline="central">Lists all collections</text></g>
<g class="c-teal"><rect x="121" y="140" width="200" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="221" y="159" text-anchor="middle" dominant-baseline="central">tiny-raw</text>
<text class="ts" x="221" y="177" text-anchor="middle" dominant-baseline="central">Raw files for CI tests</text></g>
<g class="c-teal"><rect x="407" y="140" width="200" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="507" y="159" text-anchor="middle" dominant-baseline="central">software-results</text>
<text class="ts" x="507" y="177" text-anchor="middle" dominant-baseline="central">Search engine outputs</text></g>
<g class="c-teal"><rect x="90" y="250" width="120" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="150" y="269" text-anchor="middle" dominant-baseline="central">bruker-dda</text>
<text class="ts" x="150" y="287" text-anchor="middle" dominant-baseline="central">Raw + FASTA</text></g>
<g class="c-teal"><rect x="233" y="250" width="120" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="293" y="269" text-anchor="middle" dominant-baseline="central">thermo-dia</text>
<text class="ts" x="293" y="287" text-anchor="middle" dominant-baseline="central">Raw + FASTA</text></g>
<g class="c-teal"><rect x="376" y="250" width="120" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="436" y="269" text-anchor="middle" dominant-baseline="central">maxquant</text>
<text class="ts" x="436" y="287" text-anchor="middle" dominant-baseline="central">Search output</text></g>
<g class="c-teal"><rect x="519" y="250" width="120" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="579" y="269" text-anchor="middle" dominant-baseline="central">diann</text>
<text class="ts" x="579" y="287" text-anchor="middle" dominant-baseline="central">Search output</text></g>
<g class="c-gray"><rect x="90" y="370" width="549" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="364" y="389" text-anchor="middle" dominant-baseline="central">Data files</text>
<text class="ts" x="364" y="407" text-anchor="middle" dominant-baseline="central">Stay on PRIDE, MassIVE, Zenodo, … and are referenced by URL and hash</text></g>
<path d="M364 96 L364 118 L221 118 L221 138" class="arr" marker-end="url(#arrow)"/>
<path d="M364 118 L507 118 L507 138" class="arr" marker-end="url(#arrow)"/>
<path d="M221 196 L221 222 L150 222 L150 248" class="arr" marker-end="url(#arrow)"/>
<path d="M221 222 L293 222 L293 248" class="arr" marker-end="url(#arrow)"/>
<path d="M507 196 L507 222 L436 222 L436 248" class="arr" marker-end="url(#arrow)"/>
<path d="M507 222 L579 222 L579 248" class="arr" marker-end="url(#arrow)"/>
<line x1="150" y1="306" x2="150" y2="368" class="arr" marker-end="url(#arrow)"/>
<line x1="293" y1="306" x2="293" y2="368" class="arr" marker-end="url(#arrow)"/>
<line x1="436" y1="306" x2="436" y2="368" class="arr" marker-end="url(#arrow)"/>
<line x1="579" y1="306" x2="579" y2="368" class="arr" marker-end="url(#arrow)"/>
</svg>
