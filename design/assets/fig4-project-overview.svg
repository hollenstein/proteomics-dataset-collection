<text class="ts" x="550" y="107" text-anchor="middle" dominant-baseline="central">Browse, learn, explore</text></g>
<g class="c-purple"><rect x="460" y="160" width="180" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="550" y="179" text-anchor="middle" dominant-baseline="central">Discovery</text>
